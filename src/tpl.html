@font-face{font-family:"Bodoni Moda";font-style:normal;font-weight:400 900;font-display:swap;src:url(fonts/bodoni-moda-latin-standard-normal.woff2) format("woff2")}
@font-face{font-family:"Bodoni Moda";font-style:italic;font-weight:400 900;font-display:swap;src:url(fonts/bodoni-moda-latin-standard-italic.woff2) format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/hanken-grotesk-latin-wght-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
.skip{position:absolute;left:-9999px;top:8px;z-index:50;padding:8px 14px;border-radius:999px;background:#102A22;color:#EEF1EC;font:600 14px/1.2 system-ui,sans-serif}
.skip:focus{left:12px}
</style>
<style>
/* Layout: a travel guide. Destinations first, each a trip page; every course a long-form profile; one quiet index for the full ranking. */
:root{
  --paper:#EEF1EC; --paper2:#E2E7DF; --ink:#102A22; --mute:#46574E; --line:rgba(16,42,34,.2);
  --accent:#1F5C45; --flag:#E2AE2F; --sea:#7FA4B2; --sand:#D3C190; --land:#E5EAE2; --contour:rgba(16,42,34,.2);
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1915; --paper2:#14231E; --ink:#E5ECE6; --mute:#AEBDB4; --line:rgba(229,236,230,.18);
  --accent:#86C6A5; --flag:#F0BE45; --sea:#2F5866; --sand:#7D6C45; --land:#13221D; --contour:rgba(229,236,230,.13); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0D1915; --paper2:#14231E; --ink:#E5ECE6; --mute:#AEBDB4; --line:rgba(229,236,230,.18);
  --accent:#86C6A5; --flag:#F0BE45; --sea:#2F5866; --sand:#7D6C45; --land:#13221D; --contour:rgba(229,236,230,.13); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.62;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--flag);outline-offset:3px;border-radius:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
.label{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;font-weight:500;text-transform:uppercase;color:var(--mute)}
.serif{font-family:var(--display);font-weight:500;letter-spacing:-.01em}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.brand{font-family:var(--display);font-style:italic;font-size:24px;font-weight:500;white-space:nowrap}
@media (max-width:520px){.top .wrap{height:auto;flex-wrap:wrap;gap:0 16px;padding-block:9px 7px}.brand{font-size:21px;line-height:1.2}.nav{gap:18px;font-size:14px}}
.nav{display:flex;gap:clamp(14px,3vw,30px);font-size:15px;font-weight:500}
.nav a{color:var(--mute);padding:4px 0;border-bottom:1.5px solid transparent}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.pill[hidden]{display:none}
.pill{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin-left:6px;border-radius:10px;background:var(--flag);color:#102A22;font-size:11px;font-weight:700;vertical-align:1px}

/* home */
.intro{padding-block:clamp(44px,8vw,96px) clamp(28px,5vw,48px);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:end}
.intro h1{font-family:var(--display);font-weight:400;font-size:clamp(52px,9vw,124px);line-height:.92;letter-spacing:-.03em}
.intro h1 em{font-style:italic;color:var(--accent)}
.intro p{margin:0;font-size:19px;color:var(--mute);max-width:40ch}
.intro .stats{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}
.intro .stats div{display:grid}
.intro .stats b{font-family:var(--display);font-size:34px;font-weight:500;line-height:1;color:var(--ink)}

.sec{padding-block:clamp(36px,6vw,64px)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid var(--ink)}
.sec-h h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,4.5vw,52px);line-height:1}
.sec-h a{font-weight:600;font-size:15px}
.sec-h a:hover{color:var(--accent)}

.dests{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:clamp(28px,3vw,40px) 28px}
.dest{display:grid;gap:12px}
.dest .art{border-radius:3px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--land);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.dest:hover .art{transform:scale(.985)}
.dest h3{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.05}
.dest p{margin:0;color:var(--mute);font-size:16.5px}
.dest .meta{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:10px}
canvas.art{display:block;width:100%;height:auto}
img.art{display:block;width:100%;height:auto;max-width:100%;object-fit:cover;background:var(--land)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) img.art{filter:brightness(.9)}}
:root[data-theme="dark"] img.art{filter:brightness(.9)}

.lead{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center}
.lead .art{aspect-ratio:3/2;border-radius:3px}
.lead h3{font-family:var(--display);font-weight:400;font-size:clamp(44px,6vw,80px);line-height:.95;letter-spacing:-.02em;margin:10px 0 14px}
.lead p{margin:0 0 22px;color:var(--mute);max-width:38ch}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn:hover{opacity:.88}

/* rows */
.rows{list-style:none;margin:0;padding:0}
.rows li{display:grid;grid-template-columns:56px 64px minmax(0,1fr) auto;align-items:center;gap:16px;border-bottom:1px solid var(--line)}
.rows .go{display:contents}
.rows .n{font-family:var(--display);font-size:30px;line-height:1;padding-block:16px;font-variant-numeric:tabular-nums}
.rows .nm{font-weight:600;font-size:18px;line-height:1.25}
.rows .sub{font-size:15px;color:var(--mute);display:block;font-weight:400;margin-top:2px}
.rows .sc{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.rows li:hover .nm{color:var(--accent)}
.save{width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;justify-self:end}
.save:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.save svg{width:15px;height:15px}
.save[aria-pressed="true"]{background:var(--flag);box-shadow:none;color:#102A22}

.pending{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.pending li{padding:6px 14px;border-radius:999px;background:var(--paper2);font-size:15px}
.pending li span{color:var(--mute);font-size:13px;margin-left:6px}
.extra{margin:0;display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:24px;align-items:center}
.extra .art{width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px;display:block}
.extra h3{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.05;margin:6px 0 8px}.extra p{margin:0;color:var(--mute);font-size:15px;line-height:1.55}
@media (max-width:640px){.extra{grid-template-columns:1fr;gap:12px}}

/* country groups, tiers, superlatives */
.country{display:grid;gap:22px;margin-bottom:clamp(44px,6vw,72px)}
.country .dests{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:28px 22px}
.country .dest h3{font-size:24px}
.country-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.country-h h3{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(28px,3.4vw,38px);line-height:1}
.tier{margin-bottom:clamp(40px,5vw,60px)}
.tier-h{display:grid;gap:4px;padding-bottom:12px;border-bottom:1px solid var(--ink)}
.tier-h h3{font-family:var(--display);font-weight:500;font-size:clamp(26px,3.2vw,36px);line-height:1.08}
.tier-h p{margin:0;color:var(--mute);font-size:16.5px}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--paper2);font-size:14px;font-weight:600;color:var(--ink)}
.supers{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:20px}
.super{display:grid;align-content:start;gap:10px;padding:22px;border-radius:4px;background:var(--paper2)}
.super h3{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.05}
.super ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.super li a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;font-size:16px;font-weight:500}
.super li a:hover{color:var(--accent)}
.super li b{font-family:var(--mono);font-weight:500;font-size:14px}
.super .more{font-size:15px;font-weight:600;margin-top:4px}
.super .more:hover{color:var(--accent)}
.tools .row-l{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:start}
.tools .row-l>.label{padding-top:8px}
@media (max-width:520px){.tools .row-l{grid-template-columns:minmax(0,1fr);gap:6px}.tools .row-l>.label{padding-top:0}}

/* destination page */
.back{display:inline-block;margin-top:28px;font-size:15px;font-weight:500;color:var(--mute)}
.back:hover{color:var(--ink)}
.dhero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,4vw,56px);align-items:end;padding-block:20px 40px}
.dhero h1{font-family:var(--display);font-weight:400;font-size:clamp(48px,8vw,108px);line-height:.92;letter-spacing:-.03em;margin:12px 0 18px}
.dhero p{margin:0;font-size:19px;color:var(--mute);max-width:36ch}
.dhero .art{aspect-ratio:3/2;border-radius:3px}
.trip{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:clamp(28px,5vw,72px);padding-bottom:40px}
.notes{display:grid;gap:4px;align-content:start;position:sticky;top:84px}
.notes h2{font-family:var(--display);font-weight:600;font-size:24px;margin-bottom:6px}
.notes div{display:grid;gap:2px;padding:12px 0;border-top:1px solid var(--line)}
.notes span:last-child{color:var(--mute);font-size:15px;font-style:italic}
.cards{display:grid;gap:36px}
.ccard{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:24px;align-items:center}
.ccard .art{aspect-ratio:1;border-radius:3px}
.ccard h3{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.05;margin:6px 0 8px}
.ccard h3 a:hover{color:var(--accent)}
.ccard .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:16px;color:var(--mute);margin-bottom:12px}
.ccard .facts b{color:var(--ink);font-weight:600}
.ccard .acts{display:flex;gap:10px;align-items:center}
.smallsave{padding:8px 14px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.smallsave svg{width:13px;height:13px}
.smallsave[aria-pressed="true"]{background:var(--flag);box-shadow:none;color:#102A22}


/* gallery */
.gal{padding-block:8px 8px}
.gal-grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:clamp(12px,2vw,24px)}
.gal-i{all:unset;display:block;cursor:zoom-in;border-radius:3px;overflow:hidden}
.gal-i .art{aspect-ratio:3/2;border-radius:3px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.gal-i:hover .art{transform:scale(1.02)}
.gal-i:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (max-width:640px){.gal-grid{grid-template-columns:1fr}}
#lb{position:fixed;inset:0;z-index:50;background:rgba(14,18,16,.94);display:none;align-items:center;justify-content:center;padding:3vh 3vw;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;border-radius:2px;filter:none!important}
#lb b{position:absolute;top:14px;right:20px;color:#e9ede7;font:400 14px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
@media (prefers-reduced-motion:reduce){.gal-i .art{transition:none}}
.chead .tag{font-family:var(--display);font-style:italic;font-weight:400;font-size:clamp(22px,2.6vw,30px);line-height:1.22;color:var(--accent);max-width:32ch;margin:-2px 0 16px}
.ctag{font-family:var(--display);font-style:italic;font-size:19px;line-height:1.3;color:var(--accent);margin:-2px 0 10px}
.journal .label{display:block;margin-bottom:14px}
.journal .pull{font-family:var(--display);font-style:italic;font-weight:400;font-size:clamp(26px,3.2vw,36px);line-height:1.18;letter-spacing:-.01em;max-width:24ch;margin:0 0 28px}
.journal p{max-width:62ch;margin:0 0 1em}
/* top-five strip */
.strip{display:grid;grid-template-columns:1.55fr repeat(4,minmax(0,1fr));gap:14px}
.tile{position:relative;display:block;border-radius:4px;overflow:hidden;aspect-ratio:3/4;background:var(--land);isolation:isolate}
.tile:first-child{aspect-ratio:auto}
.tile .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.tile:hover .art,.tile:focus-visible .art{transform:scale(1.045)}
.tile::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(8,20,16,.38) 0%,rgba(8,20,16,0) 34%,rgba(8,20,16,0) 52%,rgba(8,20,16,.78) 100%)}
.tile .rk{position:absolute;z-index:2;top:10px;left:14px;font-family:var(--display);font-weight:400;font-size:clamp(44px,5vw,72px);line-height:1;color:#F4F1E8;font-variant-numeric:lining-nums}
.tile:first-child .rk{font-size:clamp(64px,8vw,112px)}
.tile .cap{position:absolute;z-index:2;left:14px;right:14px;bottom:12px;color:#F4F1E8;display:grid;gap:2px}
.tile .cap b{font-family:var(--display);font-weight:600;font-size:clamp(18px,1.7vw,24px);line-height:1.08}
.tile:first-child .cap b{font-size:clamp(26px,2.8vw,38px)}
.tile .cap span{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
@media (max-width:860px){.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:clamp(16px,4vw,40px);margin-inline:calc(-1*clamp(16px,4vw,40px));padding-inline:clamp(16px,4vw,40px);scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}.tile,.tile:first-child{flex:0 0 68%;aspect-ratio:4/5;scroll-snap-align:start}}
.surprise{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:10px 18px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--ink);font-weight:600;font-size:15px}
.surprise:hover{background:var(--ink);color:var(--paper)}
.surprise svg{width:15px;height:15px}
/* face-off */
.faceoff{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:clamp(14px,3vw,36px);align-items:center}
.fo{display:grid;gap:12px}
.fo .art{aspect-ratio:3/2;border-radius:3px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.fo:hover .art{transform:scale(.985)}
.fo b{font-family:var(--display);font-weight:600;font-size:clamp(24px,2.6vw,32px);line-height:1.05}
.fo .num{font-family:var(--display);font-size:clamp(40px,5vw,64px);line-height:.9;font-variant-numeric:tabular-nums}
.fo .row2{display:flex;align-items:end;justify-content:space-between;gap:12px}
.fo.low .num{color:var(--mute)}
.vs{font-family:var(--display);font-style:italic;font-size:clamp(28px,3vw,40px);color:var(--mute)}
.fo-note{margin:18px 0 0;color:var(--mute);font-style:italic;font-family:var(--display);font-size:20px;text-align:center}
@media (max-width:640px){.faceoff{grid-template-columns:minmax(0,1fr)}.vs{text-align:center}}
/* row thumbnails */
.rows .th{display:block;width:64px;aspect-ratio:4/3;border-radius:3px;overflow:hidden;background:var(--land)}
.rows .th .art{width:100%;height:100%;aspect-ratio:auto;object-fit:cover;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.rows li:hover .th .art{transform:scale(1.08)}
/* superlative chips */
.medals{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.medal{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.medal i{width:7px;height:7px;border-radius:50%;background:var(--flag)}
/* up next */
.upnext{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:center;padding:clamp(18px,3vw,28px);border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--paper2) 45%,transparent)}
.upnext .art{aspect-ratio:3/2;border-radius:4px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.upnext:hover .art{transform:scale(.985)}
.upnext h3{font-family:var(--display);font-weight:400;font-size:clamp(36px,4.6vw,60px);line-height:.98;letter-spacing:-.02em;margin:8px 0 10px}
.upnext p{margin:0 0 18px;color:var(--mute)}
.upnext .go2{font-weight:600}
.walk{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:15px;color:var(--mute)}
.walk a{font-weight:600;color:var(--ink)}.walk a:hover{color:var(--accent)}
@media (max-width:760px){.upnext{grid-template-columns:minmax(0,1fr)}}
/* course page */
.chero{padding-block:20px 0}
.chero .art{aspect-ratio:21/9;border-radius:3px;max-height:520px;width:100%}
.chead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding-block:32px 28px;border-bottom:1px solid var(--ink)}
.chead h1{font-family:var(--display);font-weight:400;font-size:clamp(48px,8vw,112px);line-height:.92;letter-spacing:-.03em;margin:12px 0 14px}
.chead .where{font-size:19px;color:var(--mute)}
.chead .where a{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.big{text-align:right}
.big b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(64px,9vw,120px);line-height:.9;font-variant-numeric:tabular-nums}
.cbody{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:clamp(28px,6vw,88px);padding-block:48px}
.story section{margin-bottom:48px}
.story h2{font-family:var(--display);font-weight:600;font-size:30px;margin-bottom:12px}
.story p{max-width:64ch;margin:0 0 1em}
.blank{border:1px dashed var(--line);border-radius:3px;padding:22px;min-height:110px;color:var(--mute);font-size:15.5px}
.blank.tall{min-height:200px}
.side{position:sticky;top:84px;align-self:start;display:grid;gap:30px}
.side h2{font-family:var(--display);font-weight:600;font-size:22px;margin-bottom:4px}
.kv{margin:0}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;text-align:right;font-weight:600}
.kv dd.none{font-weight:400;color:var(--mute)}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 12px;padding:10px 0;font-size:15.5px}
.bar b{font-weight:600;font-variant-numeric:tabular-nums}
.bar b small{font-weight:400;color:var(--mute);font-size:13px;margin-left:1px}
.bar>span small{color:var(--mute);font-family:var(--mono);font-size:11px;margin-left:6px}
.bar i{grid-column:1/-1;height:9px;background:var(--paper2);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;position:relative}
.bar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--accent);border-radius:999px}
.bar i::before{content:"";position:absolute;z-index:1;top:-4px;bottom:-4px;left:var(--a);width:3px;margin-left:-1.5px;border-radius:2px;background:var(--flag)}
.side{counter-reset:sb}
.side>div{counter-increment:sb;border:1px solid var(--line);border-radius:10px;padding:18px 20px 16px;background:color-mix(in srgb,var(--paper2) 40%,transparent)}
.side>div>h2::before{content:counter(sb,decimal-leading-zero);display:block;font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.08em;color:var(--mute);margin-bottom:6px}
.side .kv div:last-child{border-bottom:0}
.bar b em{font-style:normal;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-right:8px;vertical-align:1px}
.bar b em.up{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.bar-note{display:block;margin-top:8px;font-size:13px;color:var(--mute)}
.bar-note i{display:inline-block;width:3px;height:12px;border-radius:2px;background:var(--flag);vertical-align:-2px;margin-right:6px}
.wide{width:100%;justify-content:center}
.side-map{aspect-ratio:1;border-radius:3px;margin-top:6px}
.maps-credit{display:block;margin-top:6px;font-size:11px}
.nearby{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:24px}
.near{display:grid;gap:8px}
.near .art{aspect-ratio:4/3;border-radius:3px}
.near b{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.1}
.near:hover b{color:var(--accent)}

/* ranking + list */
.ph{padding-block:clamp(40px,7vw,80px) 28px}
.ph h1{font-family:var(--display);font-weight:400;font-size:clamp(52px,9vw,116px);line-height:.92;letter-spacing:-.03em;margin-bottom:16px}
.ph p{margin:0;font-size:19px;color:var(--mute);max-width:46ch}
.tools{display:grid;gap:12px;margin-bottom:44px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{padding:6px 13px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:500}
.chips button:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.search{width:100%;max-width:360px;font:inherit;font-size:16px;padding:10px 0;border:0;border-bottom:1px solid var(--ink);background:transparent;color:var(--ink)}
.search::placeholder{color:var(--mute)}
.group{margin-bottom:44px}
.group h3{display:flex;justify-content:space-between;gap:12px;font-family:var(--display);font-weight:600;font-size:26px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.group h3 a:hover{color:var(--accent)}
.share{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 44px}
.share input{flex:1 1 260px;min-width:0;font:inherit;font-size:14px;padding:11px 14px;border:1px solid var(--line);border-radius:999px;background:var(--paper2);color:var(--ink)}
.empty{padding:30px 0;color:var(--mute)}
.weights{list-style:none;margin:0 0 80px;padding:0}
.weights li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:24px;padding:22px 0;border-bottom:1px solid var(--line)}
.weights b{font-family:var(--display);font-weight:400;font-size:52px;line-height:1}
.weights h3{font-size:19px;margin-bottom:2px}
.weights p{margin:0;color:var(--mute)}
footer{border-top:1px solid var(--line);padding-block:28px 48px;color:var(--mute);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:860px){
  .intro,.lead,.dhero,.trip,.cbody{grid-template-columns:minmax(0,1fr)}
  .notes,.side{position:static}
  .side{order:-1}
  .ccard{grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:start}
  .ccard h3{font-size:24px}
  .chead{grid-template-columns:minmax(0,1fr)}
  .big{text-align:left}
  .chero .art{aspect-ratio:16/10}
}
@media (max-width:520px){
  .nav .opt{display:none}
  .rows li{grid-template-columns:30px 52px minmax(0,1fr) auto;gap:10px}
  .rows .th{width:52px}
  .rows .n{font-size:24px}
  .weights li{grid-template-columns:80px minmax(0,1fr)}
  .weights b{font-size:38px}
}
.view{animation:fade .45s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.dest .art{transition:none}}
.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:48px;margin-top:40px;align-items:start}
.about-text h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-family:"Hanken Grotesk",sans-serif;font-weight:500;color:var(--mute,inherit);margin:28px 0 8px}
.about-text h2:first-child{margin-top:0}.about-text p{max-width:60ch;line-height:1.7}
@media (max-width:760px){.about-grid{grid-template-columns:1fr;gap:28px}}

function rng(seed){let h=2166136261;for(const ch of seed)h=Math.imul(h^ch.charCodeAt(0),16777619);return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

  x.strokeStyle=tok("--contour");x.lineWidth=1;
  const levels=Math.round(10*steep)+4,cw=W/nx,ch=H/ny;

    for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const a=F[j*(nx+1)+i],b=F[j*(nx+1)+i+1],c=F[(j+1)*(nx+1)+i+1],d=F[(j+1)*(nx+1)+i];const p=[];

    x.beginPath();x.ellipse(a+Math.cos(ang)*off,b+Math.sin(ang)*off,fw*(.22+r()*.22),fw*(.14+r()*.12),r()*3,0,7);x.fill()}

  x.fillStyle=tok("--land");x.globalAlpha=.3;x.beginPath();x.ellipse(gx,gy,gr*.8,gr*.68,0,0,7);x.fill();x.globalAlpha=1;
  // tee
  const[tx0,ty0]=P(0);x.fillStyle=tok("--accent");x.fillRect(tx0-fw*.35,ty0-fw*.22,fw*.7,fw*.44);

  x.fillStyle=tok("--flag");x.beginPath();x.moveTo(gx,gy-fh);x.lineTo(gx+fh*.55,gy-fh*.82);x.lineTo(gx,gy-fh*.64);x.fill();
  x.fillStyle=tok("--ink");x.beginPath();x.arc(gx,gy,2,0,7);x.fill();

function pathOf(x,s,k,ox,oy){const p=s.split(" ");for(let i=0;i<p.length;i++){const [a,b]=p[i].split(",");const X=ox+a*k,Y=oy+b*k;i?x.lineTo(X,Y):x.moveTo(X,Y)}}
function drawLayout(cv,L){
  const W=cv.clientWidth||400,H=cv.clientHeight||300,dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);const x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);
  x.fillStyle=tok("--land");x.fillRect(0,0,W,H);
  const k=Math.min(W/L.w,H/L.h)*(cv.dataset.fit==="cover"?1.18:.94),ox=(W-L.w*k)/2,oy=(H-L.h*k)/2;

  fill(L.N,acc,.13);fill(L.S,sand,.55);

    const last=L.H.find(h=>h[0]==="18")||L.H[L.H.length-1];const pts=last[1].split(" ");const [ga,gb]=pts[pts.length-1].split(",");const gx=ox+ga*k,gy=oy+gb*k,fh=Math.max(14,Math.min(W,H)*.06);

    const k=+fSort,lab=SORTS.find(x=>x[0]===fSort)[1];
    it=[...it].sort((a,b)=>(b.cats[k]||0)-(a.cats[k]||0)||a.rank-b.rank);
    $("#rk").innerHTML=`<section class="tier"><div class="tier-h"><span class="label">Sorted by ${CATS[k][0]}</span><h3>${lab}</h3><p>${CATS[k][2]}</p></div><ol class="rows">${it.map((c,i)=>`<li><a class="go" href="#c-${c.slug}"><span class="n">${i+1}</span>${thumb(c)}<span class="nm">${esc(c.name)}<span class="sub">${esc(placeOf(c))} · No. ${c.rank} overall</span></span><span class="sc">${fmt(c.cats[k])}</span></a></li>`).join("")}</ol></section>`;
  }
}

function list(shared){
  const slugs=shared||saved,items=slugs.map(s=>bySlug[s]).filter(Boolean).sort((a,b)=>a.rank-b.rank);
  const g={};items.forEach(c=>(g[c.dest]=g[c.dest]||[]).push(c));
  const link=SHARE_BASE+"#list."+saved.join(".");
  const head=shared?`<section class="ph"><h1>A shared trip</h1><p>${items.length} courses someone picked for you, grouped by destination.</p></section><div class="share"><button class="btn" id="adopt">Add all to my trip</button><a class="btn ghost" href="#list">See my trip</a></div>`
   :`<section class="ph"><h1>My trip</h1><p>${items.length?`${items.length} course${items.length>1?"s":""} saved, grouped by destination so you can plan the route.`:"Nothing saved yet. Add courses from any destination or profile and they'll gather here."}</p></section>
     ${items.length?`<div class="share"><input id="link" readonly value="${esc(link)}" aria-label="Link to your trip"><button class="btn" id="copy">Copy link</button></div>`:`<p style="margin:0 0 60px"><a class="btn" href="#">Browse destinations</a></p>`}`;
  return `<div class="wrap view">${head}${Object.entries(g).map(([k,cs])=>`<div class="group"><h3><a href="#d-${k}">${esc(byDest[k].name)}</a><span class="label">${cs.length}</span></h3><ol class="rows">${cs.map(c=>row(c,false)).join("")}</ol></div>`).join("")}<div style="height:40px"></div></div>`;
}
function how(){return `<div class="wrap view"><section class="ph"><h1>How I score</h1><p>Seven things, each out of ten, weighted by how much they matter to a great day out. The weighted total is the score on every course.</p></section>
  <ol class="weights">${CATS.map(([n,w,d])=>`<li><b>${w}%</b><div><h3>${n}</h3><p>${d}</p></div></li>`).join("")}</ol></div>`}

const ABOUT={handicap:"",home:"Edinburgh"};
function about(){const kv=(k,v)=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`;const n=C.length+DATA.unrated.length,sc=C.filter(c=>(byDest[c.dest]||{}).country==="Scotland").length;
  return `<div class="wrap view about"><section class="ph"><h1>About</h1><p>Hello, I’m Mike King. This is a small, personal record of the courses I’ve played.</p></section>
  <div class="about-grid"><dl class="kv">${kv("Based in",ABOUT.home)}${ABOUT.handicap?kv("Handicap",ABOUT.handicap):""}${kv("Courses played",String(n))}${kv("In Scotland",String(sc))}</dl>
  <div class="about-text"><h2>Why I love it</h2><p>It’s a silly old game: a pleasant walk on manicured earth, ruined by a little white ball. I find it beautiful anyway. Someone looked at a piece of land and decided where the ball should go, and the shape of a green, the bend of a fairway around a dune, or the light at the end of a round can be as good as any painting.</p>
  <h2>How I play it</h2><p>Not very scientifically. I go for the walk, the place and the people I’m with, and the score on the card matters least. The rankings here follow the same spirit: my own, a little subjective, and open to change after the next round.</p>
  <h2>How I rank</h2><p>Seven things, weighted by how much they add to a good day out. <a href="#how">See how I score</a>.</p></div></div></div>`}

function route(){
  let h=decodeURIComponent(location.hash.slice(1));let v="home",html,title="Courses I’ve Played";
  if(h==="random"){const cur=(route.last||"").slice(2),pool=C.filter(c=>c.slug!==cur),c=pool[Math.floor(Math.random()*pool.length)];history.replaceState(null,"","#c-"+c.slug);h="c-"+c.slug}
  route.last=h;
  if(h.startsWith("c-")&&bySlug[h.slice(2)]){const c=bySlug[h.slice(2)];html=course(c);v="course";title=c.name+" · Courses I’ve Played"}
  else if(h.startsWith("d-")&&byDest[h.slice(2)]){const d=byDest[h.slice(2)];html=dest(d);v="home";title=d.name+" · Courses I’ve Played"}
  else if(h==="ranking"){html=ranking();v="ranking";title="The ranking · Courses I’ve Played"}
  else if(h==="how"){html=how();v="how";title="How I score · Courses I’ve Played"}
  else if(h==="about"){html=about();v="about";title="About · Courses I’ve Played"}
  else html=home();
  $("#app").innerHTML=html;document.title=title;
  document.querySelectorAll("[data-nav]").forEach(a=>a.dataset.nav===v?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  if(v==="ranking")fillRanking();
  window.scrollTo(0,0);requestAnimationFrame(paint);
}

function syncSave(slug){const on=saved.includes(slug),c=bySlug[slug];
  document.querySelectorAll(`[data-save="${slug}"]`).forEach(b=>{b.setAttribute("aria-pressed",on);
    if(b.classList.contains("save")){b.innerHTML=on?TICK:PLUS;b.setAttribute("aria-label",`${on?"Remove":"Add"} ${c.name} ${on?"from":"to"} my trip`)}
    else if(b.classList.contains("smallsave"))b.innerHTML=on?TICK+"On my trip":PLUS+"Add to trip";
    else{b.textContent=on?"On my trip":"Add to my trip";b.classList.toggle("ghost",!on)}})}
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-save]");
  if(s){e.preventDefault();const k=s.dataset.save;saved=saved.includes(k)?saved.filter(x=>x!==k):[...saved,k];persist();syncSave(k);if(location.hash==="#list")route();return}
  const a=e.target.closest("[data-addall]");
  if(a){byDest[a.dataset.addall].courses.forEach(c=>{if(!saved.includes(c.slug))saved.push(c.slug);syncSave(c.slug)});persist();a.textContent="All added to my trip";return}
  const gs=e.target.closest("[data-gosort]");if(gs){fSort=gs.dataset.gosort;fCountry="all";fDest="all";fSet="all";q="";if(location.hash==="#ranking"){e.preventDefault();route()}return}
  const so=e.target.closest("[data-sort]");if(so){fSort=so.dataset.sort;document.querySelectorAll("[data-sort]").forEach(b=>b.setAttribute("aria-pressed",b===so));fillRanking();return}
  const fc=e.target.closest("[data-fc]");if(fc){fCountry=fc.dataset.fc;fDest="all";document.querySelectorAll("[data-fc]").forEach(b=>b.setAttribute("aria-pressed",b===fc));fillRanking();return}
  const fd=e.target.closest("[data-fd]");if(fd){fDest=fd.dataset.fd;document.querySelectorAll("[data-fd]").forEach(b=>b.setAttribute("aria-pressed",b===fd));fillRanking();return}
  const fs=e.target.closest("[data-fs]");if(fs){fSet=fs.dataset.fs;document.querySelectorAll("[data-fs]").forEach(b=>b.setAttribute("aria-pressed",b===fs));fillRanking();return}
  if(e.target.id==="copy"){const i=$("#link"),b=e.target;const done=()=>b.textContent="Copied";
    try{navigator.clipboard.writeText(i.value).then(done,()=>{i.select();b.textContent="Press copy on your keyboard"})}catch(_){i.select();b.textContent="Press copy on your keyboard"}return}
  if(e.target.id==="adopt"){location.hash.slice(6).split(".").forEach(k=>{if(bySlug[k]&&!saved.includes(k))saved.push(k)});persist();e.target.textContent="Added to my trip";return}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value.trim();fillRanking()}});

(()=>{let lb=null,cur=null;const set=(k)=>{lb.querySelector("img").src="photos/g/"+k+".jpg"+PV;cur=k};
const open=k=>{if(!lb){lb=document.createElement("div");lb.id="lb";lb.setAttribute("role","dialog");lb.setAttribute("aria-label","Photo");lb.innerHTML='<img alt=""><b>Close</b>';document.body.appendChild(lb);lb.addEventListener("click",close)}set(k);lb.classList.add("on")};
const close=()=>{lb&&lb.classList.remove("on")};
const step=d=>{if(!cur)return;const m=cur.match(/^(.*)-(\d+)$/),s=m[1],i=+m[2],n=GAL[s]||1;set(s+"-"+(((i-1+d+n)%n)+1))};
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-lb]");if(b){e.preventDefault();open(b.dataset.lb)}});
document.addEventListener("keydown",e=>{if(lb&&lb.classList.contains("on"))return;if(e.metaKey||e.ctrlKey||e.altKey||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;const h=location.hash.slice(1);if(!h.startsWith("c-")||!bySlug[h.slice(2)])return;const c=bySlug[h.slice(2)];if(e.key==="ArrowRight")location.hash="#c-"+C[c.rank%C.length].slug;else if(e.key==="ArrowLeft")location.hash="#c-"+C[(c.rank-2+C.length)%C.length].slug});
document.addEventListener("keydown",e=>{if(!lb||!lb.classList.contains("on"))return;if(e.key==="Escape")close();else if(e.key==="ArrowRight")step(1);else if(e.key==="ArrowLeft")step(-1)});
window.addEventListener("hashchange",close)})();
window.addEventListener("hashchange",route);
count();route();
if(document.fonts)document.fonts.ready.then(paint);
</script>
</body>
</html>
